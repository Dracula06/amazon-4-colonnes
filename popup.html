<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Amazon 4 Colonnes</title>
  <style>
    body {
      font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      margin: 0;
      padding: 14px;
      color: #1a1a1a;
      background: #fafafa;
      box-sizing: border-box;
    }
    h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; }
    .badge-ver { font-size: 11px; font-weight: normal; background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
    .section { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .section-title { font-weight: 600; font-size: 12px; text-transform: uppercase; color: #64748b; margin-bottom: 8px; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; font-size: 13px; }
    input[type="checkbox"] { cursor: pointer; accent-color: #0284c7; }
    .diag-box { font-size: 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; }
    .badge-kind { display: inline-block; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; }
    .badge-amazon { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .badge-fba { background: #e0f2fe; color: #0369a1; border: 1px solid #0ea5e9; }
    .badge-fbm { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    .badge-unknown { background: #f1f5f9; color: #475569; border: 1px solid #94a3b8; }
    .lock-box { margin-bottom: 8px; padding: 7px 9px; background: #fef2f2; border: 1px solid #fca5a5; border-radius: 6px; color: #7f1d1d; font-size: 11.5px; line-height: 1.4; }
    .lock-box strong { color: #b91c1c; display: block; margin-bottom: 2px; }
    .lock-box .lock-quote { display: block; margin-top: 3px; color: #991b1b; font-style: italic; font-size: 11px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    button {
      font: inherit;
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #f1f5f9; border-color: #94a3b8; }
    button.btn-primary { background: #5865f2; color: #ffffff; border-color: #4752c4; }
    button.btn-primary:hover { background: #4752c4; }
    button.btn-telegram { background: #229ED9; color: #ffffff; border-color: #1c8ec4; }
    button.btn-telegram:hover { background: #1c8ec4; }
    button.btn-dark { background: #24292f; color: #ffffff; border-color: #1b1f24; }
    button.btn-dark:hover { background: #1b1f24; }
    .full-width { grid-column: span 2; }
    .footer-links { display: flex; justify-content: space-between; font-size: 11px; margin-top: 10px; color: #64748b; }
    .footer-links a { color: #0284c7; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
    #actionStatus { font-size: 11px; margin-top: 6px; text-align: center; min-height: 16px; }
    .status-ok { color: #16a34a; font-weight: 600; }
    .status-err { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <h2>
    <span><img src="icons/icon32.png" alt="" style="width:18px;height:18px;border-radius:4px;vertical-align:middle;margin-right:6px;">Amazon 4 Colonnes</span>
    <span class="badge-ver">v1.0.0</span>
  </h2>

  <!-- 1. Interrupteurs d'affichage -->
  <div class="section">
    <div class="section-title">Personnalisation d'affichage</div>
    <label><input type="checkbox" id="optFourColumns"> 📐 Grille 4 colonnes (dès 1200 px)</label>
    <label><input type="checkbox" id="optHideAds"> 🚫 Masquer les pubs & sponsors</label>
    <label><input type="checkbox" id="optHideRecs"> 🛒 Masquer les recommandations</label>
    <label><input type="checkbox" id="optHideReviews"> ⭐ Masquer la section avis clients</label>
    <label><input type="checkbox" id="optAutoRedirect"> 🌍 Rediriger auto vers store d’origine</label>
    <label><input type="checkbox" id="optShowQuickFrame"> 🪪 Cadre rapide Amazon (FR/UK/DE/ES/IT)</label>
  </div>

  <!-- 2. Diagnostic & Vendeur -->
  <div class="section">
    <div class="section-title">Fiche & Vendeur Détectés</div>
    <div id="diagContent" class="diag-box">Chargement de la fiche Amazon...</div>
  </div>

  <!-- 3. Lien rapide Amazon Partenaires -->
  <div class="section" id="affiliateSection" style="display:none;">
    <div class="section-title">Lien rapide Amazon Partenaires</div>
    <div id="affiliateMeta" style="font-size:11.5px;color:#475569;margin-bottom:6px;"></div>
    <input id="affiliateUrlInput" type="text" readonly style="width:100%;box-sizing:border-box;padding:5px 7px;font:11.5px monospace;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;color:#0f172a;margin-bottom:6px;">
    <div class="btn-row">
      <button id="btnCopyAffiliate" title="Copier le lien rapide">📋 Copier lien</button>
      <button id="btnSiteStripe" style="display:none;" title="Ouvrir SiteStripe et générer le lien court">⚡ SiteStripe court</button>
    </div>
  </div>

  <!-- 4. Partage & Exports -->
  <div class="section">
    <div class="section-title">Partage & Actions</div>
    <div class="btn-row">
      <button id="btnDiscord" class="btn-primary" title="Notifier ce produit sur Discord">📢 Discord</button>
      <button id="btnTelegram" class="btn-telegram" title="Notifier ce produit sur Telegram">✈️ Telegram</button>
      <button id="btnGitHub" class="btn-dark full-width" title="Sauvegarder la capture sur GitHub">🐙 GitHub</button>
      <button id="btnCollector" class="full-width" title="Ouvrir la bibliothèque et le collecteur avancé">📚 Collecteur complet</button>
    </div>
    <div id="actionStatus"></div>
  </div>

  <div class="footer-links">
    <a href="#" id="linkReload">Recharger l'onglet</a>
    <a href="settings.html" target="_blank">⚙️ Réglages & Webhook</a>
  </div>

  <script src="src/display/affiliate-link.js"></script>
  <script src="popup.js"></script>
</body>
</html>
